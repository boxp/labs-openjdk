name: 'ARM32 JVMCI Validation'

on:
  push:
    branches:
      - arm32-jvmci
  pull_request:
    branches:
      - master

jobs:
  validate-arm32-jvmci:
    name: 'Validate ARM32 JVMCI files'
    runs-on: ubuntu-22.04
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Set up JDK 21'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 'Check ARM32 JVMCI files exist'
        run: |
          echo "=== Checking ARM32 JVMCI implementation files ==="
          MISSING=0
          for f in \
            "src/jdk.internal.vm.ci/share/classes/jdk/vm/ci/arm/ARM.java" \
            "src/jdk.internal.vm.ci/share/classes/jdk/vm/ci/arm/ARMKind.java" \
            "src/jdk.internal.vm.ci/share/classes/jdk/vm/ci/arm/package-info.java"; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING required files are missing"
            exit 1
          fi
          echo "All ARM32 JVMCI files are present!"

      - name: 'Compile ARM32 JVMCI sources against JVMCI API'
        run: |
          echo "=== Compiling ARM32 JVMCI source files ==="
          JVMCI_BASE=src/jdk.internal.vm.ci/share/classes/jdk/vm/ci
          STAGE=/tmp/jvmci-stage/jdk/vm/ci
          mkdir -p /tmp/arm32-out

          # Stage only the JVMCI API packages needed by ARM32, excluding:
          # - module-info.java (triggers module mode which pulls in all sources)
          # - hotspot/ (uses unnamed-variable preview features and jdk.internal.* access)
          # - services/ (imports jdk.internal.util which is not exported to unnamed module)
          for pkg in code meta common arm; do
            cp -r "$JVMCI_BASE/$pkg" "$STAGE/"
          done

          javac \
            --release 21 \
            -sourcepath /tmp/jvmci-stage \
            -d /tmp/arm32-out \
            "$STAGE/arm/ARM.java" \
            "$STAGE/arm/ARMKind.java" \
            "$STAGE/arm/package-info.java"
          echo "ARM32 JVMCI sources compiled successfully!"

      - name: 'Verify ARM32 classes were produced'
        run: |
          for cls in \
            "jdk/vm/ci/arm/ARM.class" \
            "jdk/vm/ci/arm/ARMKind.class"; do
            if [ -f "/tmp/arm32-out/$cls" ]; then
              echo "OK: $cls"
            else
              echo "ERROR: compiled class not found: $cls"
              exit 1
            fi
          done
          echo "ARM32 JVMCI class files verified!"
